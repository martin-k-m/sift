[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# `sift` is taken on PyPI, so the distribution is sift-query. The command, the
# import and the repository all stay `sift`; only the pip install line differs.
name = "sift-query"
version = "0.1.0"
description = "Query CSV and JSONL from the terminal with a tiny SQL-like language. Streaming, zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Martin Muskov", email = "martinkmuskov@gmail.com" }]
keywords = ["csv", "jsonl", "query", "sql", "data", "cli", "streaming"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: Utilities",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/martin-k-m/sift"
Repository = "https://github.com/martin-k-m/sift"

[project.scripts]
sift = "sift.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sift"]
