name: Publish to PyPI

# Publishing happens from a tag, not from a laptop. A release built by CI is
# built from exactly what is in the repository at that tag, which is the thing
# a reader can check; one uploaded by hand is built from whatever happened to
# be in that working tree.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install --upgrade build twine pytest
      - run: python -m build

      # Catches a malformed README or missing metadata, which PyPI rejects at
      # the end of the upload rather than the start.
      - run: python -m twine check dist/*

      # The tests gate the upload, and they run against the installed wheel
      # rather than the source tree on purpose. Testing the source proves the
      # code works; testing the wheel also proves the wheel contains it. A
      # module left out of the package passes every source-tree test and fails
      # for the first person who installs it, and PyPI does not allow a version
      # to be replaced, so that mistake would be permanent.
      - run: pip install dist/*.whl
      - run: python -m pytest tests -q

      # The console script is the interface most people use and nothing above
      # touches it; an entry point pointing at a function that moved would
      # otherwise ship.
      - run: sift --version

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi

    # Trusted publishing: PyPI accepts a short-lived OIDC token minted for this
    # workflow instead of a long-lived API token kept in a secret. There is no
    # credential in this repository to leak or rotate as a result.
    #
    # It needs a publisher registered on PyPI for this repo, workflow filename
    # and environment name. Without one the upload fails with an auth error
    # rather than anything that names the real cause.
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
